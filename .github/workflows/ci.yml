name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: uv sync --locked --no-build --group dev
      - name: Check the repository root layout
        run: uv run --locked --no-build python scripts/check_root_layout.py
      - name: Run tests with coverage
        run: uv run --locked --no-build pytest -q
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: coverage-report
          path: coverage.xml
          if-no-files-found: error

  sonar:
    needs: check
    runs-on: ubuntu-latest
    # This repository is private and does not carry a SONAR_TOKEN secret for
    # now (SonarCloud's Automatic Analysis covers it instead); every step
    # below self-skips while the token is absent, so the job stays green. It
    # arms the moment the repository turns public or is given the secret —
    # switch Automatic Analysis off in SonarCloud at that point.
    env:
      SONAR_ENABLED: ${{ secrets.SONAR_TOKEN != '' }}
    steps:
      - name: Sonar scan disabled notice
        if: ${{ env.SONAR_ENABLED != 'true' }}
        run: 'echo "::notice::SonarCloud scan skipped: no SONAR_TOKEN configured"'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        if: ${{ env.SONAR_ENABLED == 'true' }}
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        if: ${{ env.SONAR_ENABLED == 'true' }}
        with:
          name: coverage-report
      - uses: SonarSource/sonarqube-scan-action@22918119ff8e1ca75a623e15c8296b6ea4fbe28f  # v8.2.1
        if: ${{ env.SONAR_ENABLED == 'true' }}
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      # The scan step above blocks on the analysis (sonar.qualitygate.wait=true
      # in sonar-project.properties), so the report this reads is already
      # final. The quality gate itself passes on ratings (A/B/C), not on "0
      # findings on new code"; the fleet's action queries the API directly for
      # that stronger bar and fails loud, with the list, when it is not met. How
      # it asks — the scoped query, the proof that the scope resolves before a
      # zero reads as clean, the credential that never leaves a header — is
      # owned by the fleet's action, which this repository consumes instead of
      # copying. It reads this repository's own sonar-project.properties from
      # the workspace, so the project it asks about is this one. The reference
      # is pinned to a commit: a tag or a branch on a step guarding security
      # findings is a supply-chain hole and a silent change to what the gate
      # asserts.
      - name: SonarCloud open findings
        if: ${{ env.SONAR_ENABLED == 'true' }}
        # The action bounds each call; this is the hard ceiling, because it
        # pages and a per-call bound multiplies. A composite action's inner
        # steps take no timeout-minutes, so the ceiling belongs to this step.
        timeout-minutes: 5
        uses: overnightworks/marketplace/.github/actions/sonar-findings-gate@85b0e13e0530ed12b5a81208681015eda6f7854b # sonar-findings-gate-v1
        with:
          sonar-token: ${{ secrets.SONAR_TOKEN }}
