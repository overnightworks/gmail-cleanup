[project]
name = "gmail-cleanup"
version = "0.1.0"
description = "Personal Gmail inbox cleanup scripts"
requires-python = ">=3.12"
dependencies = [
    "google-api-python-client>=2.100.0",
    "google-auth>=2.25.0",
    "google-auth-oauthlib>=1.2.0",
]

# This project has no package to build; uv only manages the venv, not a
# distributable artifact.
[tool.uv]
package = false

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-cov>=6.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# The project is not installed (see [tool.uv] above), so tests import the
# gmail_cleanup package from `src` and the root-layout gate from `scripts`
# straight out of the tree.
pythonpath = ["src", "scripts"]
# The floor is 100 %: every module is covered except the process entry points
# and the OAuth browser flow, which carry their reason at the exclusion.
addopts = "--cov=. --cov-branch --cov-report=term-missing --cov-report=xml:coverage.xml --cov-fail-under=100"

[tool.coverage.run]
omit = ["tests/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    'if __name__ == .__main__.:',
]
